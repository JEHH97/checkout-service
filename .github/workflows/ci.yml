name: CI
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: checkout
          POSTGRES_PASSWORD: checkout
          POSTGRES_DB: checkout
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U checkout -d checkout"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://checkout:checkout@localhost:5432/checkout?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: local_ci_only_change_me
      PAYMENT_ADAPTER: fake
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: ./scripts/in-dev npm ci
      - run: ./scripts/in-dev npm run prisma:generate
      - run: ./scripts/in-dev npx prisma db push
      - run: ./scripts/in-dev npm run check
