name: CI
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.12-alpine3.24
        env:
          POSTGRES_USER: checkout
          POSTGRES_PASSWORD: checkout
          POSTGRES_DB: checkout
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U checkout -d checkout"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7.4.12-alpine3.22
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://checkout:checkout@localhost:5432/checkout?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: local_ci_only_change_me
      PAYMENT_ADAPTER: fake
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.0.0
        with:
          node-version: 24
          cache: npm
      - run: ./scripts/in-dev npm ci
      - run: ./scripts/in-dev npm run prisma:generate
      - run: ./scripts/in-dev npx prisma db push
      - run: ./scripts/in-dev npm run check
