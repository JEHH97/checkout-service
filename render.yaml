services:
  - type: web
    name: checkout-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health/live
    envVars:
      - key: NODE_ENV
        value: production
      - key: PAYMENT_ADAPTER
        value: fake
      - key: DATABASE_URL
        sync: false
      # Shared Key Value instance owned by go-shortener (go-shortener-redis).
      # Set manually to its Internal Key Value URL plus /1, e.g. redis://red-xxxx:6379/1.
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1h
      - key: TRUST_PROXY_HOPS
        value: '1'
      - key: THROTTLE_LIMIT
        value: '120'
      - key: THROTTLE_TTL_MS
        value: '60000'
      - key: AUTH_THROTTLE_LIMIT
        value: '8'
      - key: DEMO_MODE
        value: 'true'
      - key: RUN_SEED
        value: 'true'
