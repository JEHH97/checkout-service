services:
  - type: web
    name: checkout-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health/live
    envVars:
      - key: NODE_ENV
        value: production
      - key: PAYMENT_ADAPTER
        value: stripe
      - key: DATABASE_URL
        fromDatabase: { name: checkout-db, property: connectionString }
      - key: REDIS_URL
        fromService: { type: redis, name: checkout-redis, property: connectionString }
      - key: JWT_SECRET
        generateValue: true
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
  - type: worker
    name: checkout-worker
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: scripts/in-dev node dist/worker.js
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: checkout-db, property: connectionString }
      - key: REDIS_URL
        fromService: { type: redis, name: checkout-redis, property: connectionString }
databases:
  - name: checkout-db
    databaseName: checkout
    user: checkout
  - name: checkout-redis
    type: redis
